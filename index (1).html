<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Path of Alcohol in the Body</title>
<style>
  html, body { margin: 0; height: 100%; background: #10202A; }
  /* Keeps the original 800 x 600 (4:3) shape and scales it to fit any screen or Canva frame */
  #stage {
    position: absolute; inset: 0; margin: auto;
    width: min(100vw, 133.333vh); height: min(100vh, 75vw);
  }
  #stage ruffle-player, #stage ruffle-object { width: 100%; height: 100%; display: block; }
  #msg { color: #E4EEF1; font: 18px system-ui, sans-serif; text-align: center; padding: 2rem; }
</style>
<script>
  window.RufflePlayer = window.RufflePlayer || {};
  window.RufflePlayer.config = {
    autoplay: "on",          // start without a big play button
    unmuteOverlay: "hidden", // no "click to unmute" banner
    splashScreen: false,
    letterbox: "on",
    contextMenu: "rightClickOnly"
  };
</script>
<script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
</head>
<body>
<div id="stage"><p id="msg">Loading…</p></div>
<script>
  window.addEventListener("load", function () {
    var stage = document.getElementById("stage");
    if (!window.RufflePlayer || !window.RufflePlayer.newest) {
      document.getElementById("msg").textContent = "The Flash player couldn’t load. Check your internet connection and refresh.";
      return;
    }
    var player = window.RufflePlayer.newest().createPlayer();
    stage.innerHTML = "";
    stage.appendChild(player);
    var api = player.ruffle ? player.ruffle() : player;
    api.load("path_of_alcohol_in_body.swf");
  });
</script>
</body>
</html>
